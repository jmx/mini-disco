[package]
name = "mini-disco"
version = "0.1.0"
edition = "2021"
description = "Linux-first NetMD CLI/TUI for MiniDisc devices"
license = "MIT"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
cross_usb = "0.4"
minidisc = { path = "vendor/minidisc" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.10"
thiserror = "1.0"
tokio = { version = "1.36", features = ["macros", "rt-multi-thread"] }
